name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      fetch_depth:
        description: "Git history depth to scan (0 = full history)"
        required: false
        type: number
        default: 0

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan every commit, not just the tip
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
