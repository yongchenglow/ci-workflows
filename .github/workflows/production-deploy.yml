name: Production Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string
      application_name:
        description: DNS-safe application name, defaults to the caller repository name
        required: false
        type: string
        default: ""
      namespace:
        description: Kubernetes namespace, defaults to application_name
        required: false
        type: string
        default: ""
      registry:
        description: Container registry
        required: false
        type: string
        default: ghcr.io
      image_name:
        description: Image name, defaults to the caller owner and repository
        required: false
        type: string
        default: ""
      release_name:
        description: Helm release name
        required: false
        type: string
        default: app
      chart_path:
        description: Path to the Helm chart in the caller repository
        required: false
        type: string
        default: ./helm/app
      values_file:
        description: Path to production Helm values in the caller repository
        required: false
        type: string
        default: ./helm/app/values-production.yaml
      production_hostname:
        description: Fully qualified production hostname
        required: true
        type: string
      cloudflare_zone:
        description: Cloudflare zone containing the production hostname
        required: true
        type: string
      production_node_port:
        description: Dedicated Kubernetes NodePort for the application
        required: true
        type: number
    outputs:
      deployment_url:
        description: Production deployment URL
        value: ${{ jobs.deploy.outputs.deployment_url }}

env:
  PORT_MAPPING_NAMESPACE: default
  INFRA_LOCK_CONFIGMAP: ci-workflows-infra-lock

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ inputs.production_hostname }}
    permissions:
      contents: read
      packages: read
      deployments: write
    outputs:
      deployment_url: https://${{ inputs.production_hostname }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate configuration
        id: config
        env:
          APPLICATION_NAME_INPUT: ${{ inputs.application_name }}
          NAMESPACE_INPUT: ${{ inputs.namespace }}
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
          PRODUCTION_HOSTNAME: ${{ inputs.production_hostname }}
          CLOUDFLARE_ZONE: ${{ inputs.cloudflare_zone }}
          PRODUCTION_NODE_PORT: ${{ inputs.production_node_port }}
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
        run: |
          application_name="$APPLICATION_NAME_INPUT"
          if [ -z "$application_name" ]; then
            repository_name="${GITHUB_REPOSITORY#*/}"
            application_name=$(tr '[:upper:]' '[:lower:]' <<< "$repository_name" |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          fi
          namespace="${NAMESPACE_INPUT:-$application_name}"
          image_name="${IMAGE_NAME_INPUT:-$GITHUB_REPOSITORY}"

          if ! [[ "$application_name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "application_name must be a lowercase DNS label"
            exit 1
          fi
          if ! [[ "$namespace" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "namespace must be a lowercase DNS label"
            exit 1
          fi
          if [ ${#application_name} -gt 40 ] || [ ${#namespace} -gt 63 ]; then
            echo "application_name must be at most 40 characters and namespace at most 63"
            exit 1
          fi
          if ! [[ "$PRODUCTION_HOSTNAME" =~ ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$ ]]; then
            echo "production_hostname must be a lowercase fully qualified hostname"
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_ZONE" =~ ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$ ]]; then
            echo "cloudflare_zone must be a lowercase DNS zone"
            exit 1
          fi
          if [ "$PRODUCTION_NODE_PORT" -lt 30000 ] || [ "$PRODUCTION_NODE_PORT" -gt 32767 ]; then
            echo "production_node_port must be in the default Kubernetes NodePort range 30000-32767"
            exit 1
          fi

          missing=()
          for name in KUBE_SERVER KUBE_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_TUNNEL_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required configuration: %s\n' "${missing[@]}"
            exit 1
          fi

          {
            echo "application_name=$application_name"
            echo "namespace=$namespace"
            echo "image_name=$(tr '[:upper:]' '[:lower:]' <<< "$image_name")"
          } >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Configure Kubernetes
        env:
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          mkdir -p ~/.kube
          touch ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster prod --server="$KUBE_SERVER"
          kubectl config set-credentials deployer --token="$KUBE_TOKEN"
          kubectl config set-context prod --cluster=prod --user=deployer
          kubectl config use-context prod

      - name: Deploy with Helm
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          VALUES_FILE: ${{ inputs.values_file }}
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.registry }}/${{ steps.config.outputs.image_name }}
          PRODUCTION_NODE_PORT: ${{ inputs.production_node_port }}
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values "$VALUES_FILE" \
            --set-string "image.tag=$IMAGE_TAG" \
            --set-string "image.repository=$IMAGE_REPOSITORY" \
            --set "service.nodePort=$PRODUCTION_NODE_PORT" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: kubectl rollout status deployment -l "app.kubernetes.io/instance=$RELEASE_NAME" -n "$NAMESPACE" --timeout=1m

      - name: Configure Cloudflare tunnel route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          PRODUCTION_HOSTNAME: ${{ inputs.production_hostname }}
          PRODUCTION_NODE_PORT: ${{ inputs.production_node_port }}
        run: |
          lock_owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-tunnel"
          release_lock() {
            owner=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
              -o jsonpath='{.data.owner}' 2>/dev/null || true)
            if [ "$owner" = "$lock_owner" ]; then
              kubectl delete configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" --wait=false >/dev/null
            fi
          }
          trap release_lock EXIT

          deadline=$((SECONDS + 180))
          until kubectl create configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
            --from-literal="owner=$lock_owner" --from-literal="created_at=$(date +%s)" >/dev/null 2>&1; do
            lock_json=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" -o json 2>/dev/null || echo '{}')
            stale_owner=$(jq -r '.data.owner // empty' <<< "$lock_json")
            created_at=$(jq -r '.data.created_at // 0' <<< "$lock_json")
            if [[ "$created_at" =~ ^[0-9]+$ ]] && [ "$created_at" -gt 0 ] &&
              [ $(( $(date +%s) - created_at )) -gt 120 ]; then
              current_owner=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
                -o jsonpath='{.data.owner}' 2>/dev/null || true)
              if [ "$current_owner" = "$stale_owner" ]; then
                echo "Removing stale infrastructure lock owned by $stale_owner"
                kubectl delete configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" --wait=false >/dev/null || true
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for the infrastructure lock"
              exit 1
            fi
            sleep 5
          done

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/configurations"
          current=$(curl --fail-with-body --silent --show-error "$endpoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          jq -e '.success == true' <<< "$current" >/dev/null

          config=$(jq --arg hostname "$PRODUCTION_HOSTNAME" --arg service "http://localhost:$PRODUCTION_NODE_PORT" '
            .result.config |
            .ingress = (((.ingress // []) | map(select(.hostname != $hostname and .service != "http_status:404")))
              + [{hostname: $hostname, service: $service}, {service: "http_status:404"}])
          ' <<< "$current")
          payload=$(jq -cn --argjson config "$config" '{config:$config}')
          response=$(curl --fail-with-body --silent --show-error -X PUT "$endpoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          jq -e '.success == true' <<< "$response" >/dev/null

      - name: Configure Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_ZONE: ${{ inputs.cloudflare_zone }}
          PRODUCTION_HOSTNAME: ${{ inputs.production_hostname }}
        run: |
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_response=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones?name=$CLOUDFLARE_ZONE" "${headers[@]}")
          zone_id=$(jq -er '.result[0].id' <<< "$zone_response")
          records_url="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          existing=$(curl --fail-with-body --silent --show-error \
            "$records_url?type=CNAME&name=$PRODUCTION_HOSTNAME" "${headers[@]}")
          record_id=$(jq -r '.result[0].id // empty' <<< "$existing")
          payload=$(jq -cn --arg name "$PRODUCTION_HOSTNAME" --arg content "$CLOUDFLARE_TUNNEL_ID.cfargotunnel.com" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$record_id" ]; then
            response=$(curl --fail-with-body --silent --show-error -X PUT "$records_url/$record_id" \
              "${headers[@]}" --data "$payload")
          else
            response=$(curl --fail-with-body --silent --show-error -X POST "$records_url" \
              "${headers[@]}" --data "$payload")
          fi
          jq -e '.success == true' <<< "$response" >/dev/null
