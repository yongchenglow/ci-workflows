name: Production Rollback

on:
  workflow_call:

env:
  NAMESPACE: personal-site

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://${{ vars.CLOUDFLARE_DOMAIN }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate last deployment was successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking if there's a successful production deployment..."

          # Get the last deployment to the production environment
          LAST_DEPLOY=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/deployments?environment=production&per_page=1" \
            --jq '.[0]')

          if [ -z "$LAST_DEPLOY" ] || [ "$LAST_DEPLOY" = "null" ]; then
            echo "✗ ERROR: No deployment found for production environment"
            echo "Cannot rollback when there are no deployments."
            exit 1
          fi

          DEPLOYMENT_ID=$(echo "$LAST_DEPLOY" | jq -r '.id')

          # Get the deployment status
          DEPLOY_STATUS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses" \
            --jq '.[0].state')

          if [ "$DEPLOY_STATUS" != "success" ]; then
            echo "✗ ERROR: Last production deployment status: $DEPLOY_STATUS"
            echo "Cannot rollback when the last deployment was not successful."
            exit 1
          fi

          echo "✓ Found successful production deployment (ID: $DEPLOYMENT_ID)"

      - name: Validate required secrets
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.KUBECONFIG_SERVER }}" ]; then
            MISSING_SECRETS+=("KUBECONFIG_SERVER")
          fi
          if [ -z "${{ secrets.KUBECONFIG_TOKEN }}" ]; then
            MISSING_SECRETS+=("KUBECONFIG_TOKEN")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "✗ ERROR: Missing required secrets:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "Please configure these secrets in your repository settings."
            exit 1
          fi

          echo "✓ All required secrets are configured"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.22.0"

      - name: Setup Kubernetes config
        env:
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          mkdir -p ~/.kube
          touch ~/.kube/config
          chmod 600 ~/.kube/config
          # Cluster API is fronted by a proxied Cloudflare tunnel hostname,
          # so the client sees Cloudflare's trusted cert (normal TLS verify).
          kubectl config set-cluster prod --server="$KUBE_SERVER"
          kubectl config set-credentials deployer --token="$KUBE_TOKEN"
          kubectl config set-context prod --cluster=prod --user=deployer
          kubectl config use-context prod

      - name: Validate release exists and can be rolled back
        run: |
          RELEASE_NAME="web"

          # Check if release exists
          if ! helm list -n "${{ env.NAMESPACE }}" | grep -q "$RELEASE_NAME"; then
            echo "✗ ERROR: No Helm release found for $RELEASE_NAME in namespace ${{ env.NAMESPACE }}"
            echo "Cannot rollback a release that doesn't exist."
            exit 1
          fi

          # Get current revision
          CURRENT_REVISION=$(helm list -n "${{ env.NAMESPACE }}" -o json | jq -r '.[] | select(.name=="'$RELEASE_NAME'") | .revision')

          echo "Current revision: $CURRENT_REVISION"

          # Check if there's a previous revision to rollback to
          if [ "$CURRENT_REVISION" -eq 1 ]; then
            echo "✗ ERROR: Cannot rollback - currently at revision 1 (first deployment)"
            echo "There is no previous revision to rollback to."
            exit 1
          fi

          echo "✓ Rollback validation passed - will rollback from revision $CURRENT_REVISION to revision $((CURRENT_REVISION - 1))"

      - name: Show deployment history
        run: |
          echo "Current deployment history:"
          helm history web -n ${{ env.NAMESPACE }} --max 10

      - name: Rollback Helm release
        run: |
          RELEASE_NAME="web"

          echo "Rolling back to previous revision"
          helm rollback "$RELEASE_NAME" -n "${{ env.NAMESPACE }}" --wait --timeout 10m

      - name: Verify rollback
        run: |
          kubectl rollout status deployment/web -n ${{ env.NAMESPACE }} --timeout=1m

          echo ""
          echo "Rollback completed successfully!"
          echo "Current revision:"
          helm list -n ${{ env.NAMESPACE }}
