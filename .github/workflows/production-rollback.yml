name: Production Rollback

on:
  workflow_call:
    inputs:
      application_name:
        description: DNS-safe application name, defaults to the caller repository name
        required: false
        type: string
        default: ""
      namespace:
        description: Kubernetes namespace, defaults to application_name
        required: false
        type: string
        default: ""
      release_name:
        description: Helm release name
        required: false
        type: string
        default: app
      production_hostname:
        description: Fully qualified production hostname
        required: true
        type: string

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://${{ inputs.production_hostname }}
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Validate configuration
        id: config
        env:
          APPLICATION_NAME_INPUT: ${{ inputs.application_name }}
          NAMESPACE_INPUT: ${{ inputs.namespace }}
          PRODUCTION_HOSTNAME: ${{ inputs.production_hostname }}
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          application_name="$APPLICATION_NAME_INPUT"
          if [ -z "$application_name" ]; then
            repository_name="${GITHUB_REPOSITORY#*/}"
            application_name=$(tr '[:upper:]' '[:lower:]' <<< "$repository_name" |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          fi
          namespace="${NAMESPACE_INPUT:-$application_name}"

          if ! [[ "$application_name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "application_name must be a lowercase DNS label"
            exit 1
          fi
          if ! [[ "$namespace" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] || [ ${#namespace} -gt 63 ]; then
            echo "namespace must be a lowercase DNS label with at most 63 characters"
            exit 1
          fi
          if ! [[ "$PRODUCTION_HOSTNAME" =~ ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$ ]]; then
            echo "production_hostname must be a lowercase fully qualified hostname"
            exit 1
          fi
          if [ -z "$KUBE_SERVER" ] || [ -z "$KUBE_TOKEN" ]; then
            echo "KUBECONFIG_SERVER and KUBECONFIG_TOKEN are required"
            exit 1
          fi

          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"

      - name: Validate last deployment was successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_deployment=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/deployments?environment=production&per_page=1" \
            --jq '.[0]')

          if [ -z "$last_deployment" ] || [ "$last_deployment" = "null" ]; then
            echo "No successful production deployment is available to roll back"
            exit 1
          fi

          deployment_id=$(jq -r '.id' <<< "$last_deployment")
          deployment_status=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/deployments/$deployment_id/statuses" \
            --jq '.[0].state')
          if [ "$deployment_status" != "success" ]; then
            echo "Latest production deployment status is $deployment_status, expected success"
            exit 1
          fi

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Configure Kubernetes
        env:
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          mkdir -p ~/.kube
          touch ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster prod --server="$KUBE_SERVER"
          kubectl config set-credentials deployer --token="$KUBE_TOKEN"
          kubectl config set-context prod --cluster=prod --user=deployer
          kubectl config use-context prod

      - name: Validate rollback target
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: |
          current_revision=$(helm status "$RELEASE_NAME" -n "$NAMESPACE" -o json | jq -r '.version')
          if [ "$current_revision" -le 1 ]; then
            echo "Release $RELEASE_NAME has no previous revision"
            exit 1
          fi
          echo "Rolling back revision $current_revision to $((current_revision - 1))"
          helm history "$RELEASE_NAME" -n "$NAMESPACE" --max 10

      - name: Roll back Helm release
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: helm rollback "$RELEASE_NAME" -n "$NAMESPACE" --wait --timeout 10m

      - name: Verify rollback
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: kubectl rollout status deployment -l "app.kubernetes.io/instance=$RELEASE_NAME" -n "$NAMESPACE" --timeout=1m
