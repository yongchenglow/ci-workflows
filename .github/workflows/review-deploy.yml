name: Review App Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string
      review_id:
        description: Stable review identifier, such as pr-77
        required: true
        type: string
      application_name:
        description: DNS-safe application name, defaults to the caller repository name
        required: false
        type: string
        default: ""
      production_namespace:
        description: Namespace containing the registry pull secret, defaults to application_name
        required: false
        type: string
        default: ""
      registry:
        description: Container registry
        required: false
        type: string
        default: ghcr.io
      image_name:
        description: Image name, defaults to the caller owner and repository
        required: false
        type: string
        default: ""
      release_name:
        description: Helm release name
        required: false
        type: string
        default: app
      chart_path:
        description: Path to the Helm chart in the caller repository
        required: false
        type: string
        default: ./helm/app
      values_file:
        description: Path to review Helm values in the caller repository
        required: false
        type: string
        default: ./helm/app/values-review.yaml
      review_domain:
        description: Domain appended to review_id, such as review.example.com
        required: true
        type: string
      cloudflare_zone:
        description: Cloudflare zone containing the review domain
        required: true
        type: string
      registry_secret_name:
        description: Image pull secret copied from the production namespace
        required: false
        type: string
        default: ghcr-secret

env:
  PORT_MAPPING_NAMESPACE: default
  PORT_MAPPING_CONFIGMAP: ci-workflows-review-ports
  INFRA_LOCK_CONFIGMAP: ci-workflows-infra-lock
  PORT_RANGE_START: 31000
  PORT_RANGE_END: 31999

jobs:
  deploy:
    name: Deploy ${{ inputs.review_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prevent an older update or a close event racing this PR's deployment.
    # Cross-PR shared state is protected by a Kubernetes-backed mutex below.
    concurrency:
      group: review-app-${{ github.repository }}-${{ inputs.review_id }}
      cancel-in-progress: false
    environment:
      name: review/${{ inputs.review_id }}
      url: https://${{ inputs.review_id }}.${{ inputs.review_domain }}
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate configuration
        id: config
        env:
          REVIEW_ID: ${{ inputs.review_id }}
          APPLICATION_NAME_INPUT: ${{ inputs.application_name }}
          PRODUCTION_NAMESPACE_INPUT: ${{ inputs.production_namespace }}
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
          REVIEW_DOMAIN: ${{ inputs.review_domain }}
          CLOUDFLARE_ZONE: ${{ inputs.cloudflare_zone }}
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
        run: |
          application_name="$APPLICATION_NAME_INPUT"
          if [ -z "$application_name" ]; then
            repository_name="${GITHUB_REPOSITORY#*/}"
            application_name=$(tr '[:upper:]' '[:lower:]' <<< "$repository_name" |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          fi
          production_namespace="${PRODUCTION_NAMESPACE_INPUT:-$application_name}"
          image_name="${IMAGE_NAME_INPUT:-$GITHUB_REPOSITORY}"
          namespace="$application_name-$REVIEW_ID"
          mapping_key="$application_name-$REVIEW_ID"
          hostname="$REVIEW_ID.$REVIEW_DOMAIN"

          if ! [[ "$REVIEW_ID" =~ ^pr-[0-9]+$ ]]; then
            echo "Invalid review_id: $REVIEW_ID"
            exit 1
          fi
          if ! [[ "$application_name" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] || [ ${#application_name} -gt 40 ]; then
            echo "application_name must be a lowercase DNS label with at most 40 characters"
            exit 1
          fi
          if ! [[ "$production_namespace" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] ||
            [ ${#production_namespace} -gt 63 ]; then
            echo "production_namespace must be a lowercase DNS label with at most 63 characters"
            exit 1
          fi
          if [ ${#namespace} -gt 63 ]; then
            echo "The derived review namespace exceeds 63 characters"
            exit 1
          fi
          if ! [[ "$REVIEW_DOMAIN" =~ ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$ ]]; then
            echo "review_domain must be a lowercase fully qualified domain"
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_ZONE" =~ ^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$ ]]; then
            echo "cloudflare_zone must be a lowercase DNS zone"
            exit 1
          fi

          missing=()
          for name in KUBE_SERVER KUBE_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_TUNNEL_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required configuration: %s\n' "${missing[@]}"
            exit 1
          fi

          {
            echo "namespace=$namespace"
            echo "production_namespace=$production_namespace"
            echo "mapping_key=$mapping_key"
            echo "hostname=$hostname"
            echo "image_name=$(tr '[:upper:]' '[:lower:]' <<< "$image_name")"
          } >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Configure Kubernetes
        env:
          KUBE_SERVER: ${{ secrets.KUBECONFIG_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBECONFIG_TOKEN }}
        run: |
          mkdir -p ~/.kube
          touch ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster prod --server="$KUBE_SERVER"
          kubectl config set-credentials deployer --token="$KUBE_TOKEN"
          kubectl config set-context prod --cluster=prod --user=deployer
          kubectl config use-context prod

      - name: Allocate NodePort
        id: port
        env:
          MAPPING_KEY: ${{ steps.config.outputs.mapping_key }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          lock_owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-port"
          release_lock() {
            owner=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
              -o jsonpath='{.data.owner}' 2>/dev/null || true)
            if [ "$owner" = "$lock_owner" ]; then
              kubectl delete configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" --wait=false >/dev/null
            fi
          }
          trap release_lock EXIT

          deadline=$((SECONDS + 180))
          until kubectl create configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
            --from-literal="owner=$lock_owner" --from-literal="created_at=$(date +%s)" >/dev/null 2>&1; do
            lock_json=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" -o json 2>/dev/null || echo '{}')
            stale_owner=$(jq -r '.data.owner // empty' <<< "$lock_json")
            created_at=$(jq -r '.data.created_at // 0' <<< "$lock_json")
            if [[ "$created_at" =~ ^[0-9]+$ ]] && [ "$created_at" -gt 0 ] && [ $(( $(date +%s) - created_at )) -gt 120 ]; then
              current_owner=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
                -o jsonpath='{.data.owner}' 2>/dev/null || true)
              if [ "$current_owner" = "$stale_owner" ]; then
                echo "Removing stale review infrastructure lock owned by $stale_owner"
                kubectl delete configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" --wait=false >/dev/null || true
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for the review infrastructure lock"
              exit 1
            fi
            sleep 5
          done

          if ! kubectl get configmap "$PORT_MAPPING_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" >/dev/null 2>&1; then
            kubectl create configmap "$PORT_MAPPING_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE"
          fi

          mappings=$(kubectl get configmap "$PORT_MAPPING_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" -o json)
          port=$(jq -r --arg key "$MAPPING_KEY" '.data[$key] // empty' <<< "$mappings")

          # The ConfigMap is not authoritative on its own. A review namespace whose
          # deletion timed out, a service created outside these workflows, or a
          # mapping this workflow wrote before a failed Helm release all leave the
          # record and the cluster disagreeing. Read the ports the cluster actually
          # holds and treat them as the second source of truth.
          #
          # A credential without cluster-scoped list access makes kubectl print
          # "Forbidden" to stderr and still exit 0, which would leave the port list
          # empty and silently hide ports that are really taken. Check the
          # permission explicitly rather than trusting the exit status.
          if ! kubectl auth can-i list services --all-namespaces >/dev/null 2>&1; then
            echo "The deploy credential cannot list services in all namespaces."
            echo "NodePort collisions cannot be detected without it. Grant list"
            echo "access to services cluster-wide and re-run."
            exit 1
          fi

          # Ports held by this release's own service are not conflicts. Excluding
          # them keeps a redeploy on the port it already serves.
          in_use=$(kubectl get svc --all-namespaces -o json |
            jq -r --arg ns "$NAMESPACE" --arg name "$RELEASE_NAME" '
              .items[]
              | select(.metadata.namespace != $ns or .metadata.name != $name)
              | .spec.ports[]? | select(.nodePort != null) | .nodePort | tostring')

          echo "NodePorts held elsewhere in the cluster:"
          sort -n <<< "$in_use" | tr '\n' ' '
          echo

          # A stored mapping is only reusable if the port is still free. Otherwise
          # the collision repeats on every run, because a failed release leaves the
          # mapping behind and this step would keep handing back the same port.
          if [ -n "$port" ] && grep -qx "$port" <<< "$in_use"; then
            echo "Mapped NodePort $port is held by another service. Reallocating."
            port=""
          fi

          if [ -z "$port" ]; then
            allocated=$(printf '%s\n%s\n' \
              "$(jq -r --arg key "$MAPPING_KEY" '.data // {} | to_entries[] | select(.key != $key) | .value' <<< "$mappings")" \
              "$in_use")
            for candidate in $(seq "$PORT_RANGE_START" "$PORT_RANGE_END"); do
              if ! grep -qx "$candidate" <<< "$allocated"; then
                port=$candidate
                break
              fi
            done
            if [ -z "$port" ]; then
              echo "No free NodePort in $PORT_RANGE_START-$PORT_RANGE_END"
              exit 1
            fi
            kubectl patch configmap "$PORT_MAPPING_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
              --type merge --patch "$(jq -cn --arg key "$MAPPING_KEY" --arg port "$port" '{data:{($key):$port}}')"
          fi

          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "Using NodePort $port for $MAPPING_KEY"

      - name: Prepare review namespace
        env:
          NAMESPACE: ${{ steps.config.outputs.namespace }}
          PRODUCTION_NAMESPACE: ${{ steps.config.outputs.production_namespace }}
          REGISTRY_SECRET_NAME: ${{ inputs.registry_secret_name }}
        run: |
          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"

          kubectl get secret "$REGISTRY_SECRET_NAME" -n "$PRODUCTION_NAMESPACE" -o json |
            jq --arg namespace "$NAMESPACE" '
              .metadata.namespace = $namespace |
              del(.metadata.creationTimestamp, .metadata.resourceVersion, .metadata.uid, .metadata.managedFields)
            ' |
            kubectl apply -f -

      - name: Deploy with Helm
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          VALUES_FILE: ${{ inputs.values_file }}
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.registry }}/${{ steps.config.outputs.image_name }}
          NODE_PORT: ${{ steps.port.outputs.port }}
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --values "$VALUES_FILE" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set service.nodePort="$NODE_PORT" \
            --wait \
            --timeout 10m

      - name: Configure Cloudflare tunnel route
        env:
          REVIEW_HOSTNAME: ${{ steps.config.outputs.hostname }}
          NODE_PORT: ${{ steps.port.outputs.port }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
        run: |
          lock_owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-tunnel"
          release_lock() {
            owner=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
              -o jsonpath='{.data.owner}' 2>/dev/null || true)
            if [ "$owner" = "$lock_owner" ]; then
              kubectl delete configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" --wait=false >/dev/null
            fi
          }
          trap release_lock EXIT

          deadline=$((SECONDS + 180))
          until kubectl create configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
            --from-literal="owner=$lock_owner" --from-literal="created_at=$(date +%s)" >/dev/null 2>&1; do
            lock_json=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" -o json 2>/dev/null || echo '{}')
            stale_owner=$(jq -r '.data.owner // empty' <<< "$lock_json")
            created_at=$(jq -r '.data.created_at // 0' <<< "$lock_json")
            if [[ "$created_at" =~ ^[0-9]+$ ]] && [ "$created_at" -gt 0 ] && [ $(( $(date +%s) - created_at )) -gt 120 ]; then
              current_owner=$(kubectl get configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" \
                -o jsonpath='{.data.owner}' 2>/dev/null || true)
              if [ "$current_owner" = "$stale_owner" ]; then
                echo "Removing stale review infrastructure lock owned by $stale_owner"
                kubectl delete configmap "$INFRA_LOCK_CONFIGMAP" -n "$PORT_MAPPING_NAMESPACE" --wait=false >/dev/null || true
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for the review infrastructure lock"
              exit 1
            fi
            sleep 5
          done

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$CLOUDFLARE_TUNNEL_ID/configurations"
          current=$(curl --fail-with-body --silent --show-error "$endpoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          jq -e '.success == true' <<< "$current" >/dev/null

          config=$(jq --arg hostname "$REVIEW_HOSTNAME" --arg service "http://localhost:$NODE_PORT" '
            .result.config |
            .ingress = (((.ingress // []) | map(select(.hostname != $hostname and .service != "http_status:404")))
              + [{hostname: $hostname, service: $service}, {service: "http_status:404"}])
          ' <<< "$current")
          payload=$(jq -cn --argjson config "$config" '{config:$config}')
          response=$(curl --fail-with-body --silent --show-error -X PUT "$endpoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          jq -e '.success == true' <<< "$response" >/dev/null

      - name: Configure Cloudflare DNS
        env:
          REVIEW_HOSTNAME: ${{ steps.config.outputs.hostname }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          CLOUDFLARE_ZONE: ${{ inputs.cloudflare_zone }}
        run: |
          headers=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          zone_response=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones?name=$CLOUDFLARE_ZONE" "${headers[@]}")
          zone_id=$(jq -er '.result[0].id' <<< "$zone_response")
          records_url="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          existing=$(curl --fail-with-body --silent --show-error \
            "$records_url?type=CNAME&name=$REVIEW_HOSTNAME" "${headers[@]}")
          record_id=$(jq -r '.result[0].id // empty' <<< "$existing")
          payload=$(jq -cn --arg name "$REVIEW_HOSTNAME" --arg content "$CLOUDFLARE_TUNNEL_ID.cfargotunnel.com" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true}')

          if [ -n "$record_id" ]; then
            response=$(curl --fail-with-body --silent --show-error -X PUT "$records_url/$record_id" \
              "${headers[@]}" --data "$payload")
          else
            response=$(curl --fail-with-body --silent --show-error -X POST "$records_url" \
              "${headers[@]}" --data "$payload")
          fi
          jq -e '.success == true' <<< "$response" >/dev/null

      - name: Publish review URL
        env:
          REVIEW_HOSTNAME: ${{ steps.config.outputs.hostname }}
        run: echo "Review app is available at https://$REVIEW_HOSTNAME"
